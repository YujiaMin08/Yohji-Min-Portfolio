<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages — redirects any deep link
      // back to index.html with the original path stashed in the query,
      // where a small snippet in index.html will restore it via history.replaceState.
      (function () {
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            "/?p=" +
            encodeURIComponent(l.pathname + l.search) +
            (l.hash || "")
        );
      })();
    </script>
  </head>
  <body></body>
</html>
